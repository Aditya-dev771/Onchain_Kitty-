name: Bootstrap Onchain Kitty repository

on:
  push:
    branches:
      - main
    paths:
      - onchain-kitty-source.tar.gz

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4

      - name: Expand verified website source
        run: |
          tar -xzf onchain-kitty-source.tar.gz
          rm onchain-kitty-source.tar.gz
          rm .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch Onchain Kitty website"
          git push
